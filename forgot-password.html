<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Campus Lost & Found</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="form-container">

        <h1>Forgot Password?</h1>

        <p class="form-description">
            Enter your UEM email to receive an OTP.
        </p>

        <form id="forgotPasswordForm">

            <label for="email">
                College Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@uem.edu.in"
                required
            >

            <button
                type="submit"
                class="submit-btn"
            >
                Send OTP
            </button>

        </form>


        <!-- OTP + New Password Section -->

        <div id="resetSection" style="display: none;">

            <label for="otp">
                Enter OTP
            </label>

            <input
                type="text"
                id="otp"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
            >


            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >


            <label for="confirmPassword">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
            >


            <button
                type="button"
                id="resetPasswordBtn"
                class="submit-btn"
            >
                Reset Password
            </button>

        </div>


        <p style="text-align: center; margin-top: 20px;">
            Remember your password?
            <a href="login.html">Back to Login</a>
        </p>

    </main>


    <script>

        const forgotPasswordForm =
            document.getElementById("forgotPasswordForm");

        const resetSection =
            document.getElementById("resetSection");

        const resetPasswordBtn =
            document.getElementById("resetPasswordBtn");

        let resetEmail = "";


        // ==============================
        // SEND OTP
        // ==============================

        forgotPasswordForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document.getElementById("email").value
                    .trim()
                    .toLowerCase();


                if (!email.endsWith("@uem.edu.in")) {

                    alert("Please use your UEM college email.");

                    return;
                }


                try {

                    const response =
                        await fetch("/api/forgot-password", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                email: email
                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        alert(data.error);

                        return;
                    }


                    resetEmail = email;


                    alert(
                        "OTP has been sent to your UEM email."
                    );


                    resetSection.style.display = "block";


                } catch (error) {

                    console.error(error);

                    alert(
                        "Could not connect to the server."
                    );

                }

            }
        );


        // ==============================
        // RESET PASSWORD
        // ==============================

        resetPasswordBtn.addEventListener(
            "click",
            async function() {

                const otp =
                    document.getElementById("otp").value.trim();

                const newPassword =
                    document.getElementById("newPassword").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;


                if (otp.length !== 6) {

                    alert("Please enter the 6-digit OTP.");

                    return;
                }


                if (newPassword.length < 6) {

                    alert(
                        "Password must be at least 6 characters."
                    );

                    return;
                }


                if (newPassword !== confirmPassword) {

                    alert("Passwords do not match.");

                    return;
                }


                try {

                    const response =
                        await fetch("/api/reset-password", {

                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({

                                email: resetEmail,

                                otp: otp,

                                newPassword: newPassword

                            })

                        });


                    const data =
                        await response.json();


                    if (!response.ok) {

                        alert(data.error);

                        return;
                    }


                    alert(
                        "Password reset successfully! Please login."
                    );


                    window.location.href =
                        "login.html";


                } catch (error) {

                    console.error(error);

                    alert(
                        "Something went wrong. Please try again."
                    );

                }

            }
        );

    </script>

</body>

</html>
